id: ecommerce_cancel_order
agent: ecommerce

# Domain: ecommerce
# Intent: customer placed an order by mistake and wants to cancel it immediately
# Expected tool: cancel_order with reason ordered_by_mistake
# Confusion risk: process_refund (customer wants money back but item not yet delivered)
#                 check_order_status (asking about an order)
#
# Baseline English confirmed 3/3 before translation. Natural phrasing in each language.

locales:
  en:
    input: "I just ordered something by mistake. I need it cancelled immediately."
    expect:
      toolCall:
        name: cancel_order
        arguments:
          reason: ordered_by_mistake
      noToolCall:
        name: contact_seller

  fr:
    input: "Je viens de passer une commande par erreur. J'ai besoin de l'annuler immédiatement."
    expect:
      toolCall:
        name: cancel_order
        arguments:
          reason: ordered_by_mistake
      noToolCall:
        name: contact_seller

