id: scheduling_reschedule
agent: scheduling

# Domain: scheduling
# Intent: customer can't make their appointment and wants to move it to a specific new day
# Expected tool: reschedule_appointment
# Confusion risk: cancel_appointment (can't make it, could be read as wanting to cancel)
#                 book_new_appointment (needs a new time, could be read as new booking)
#
# Without a stated reason and target day the model asks back instead of acting.
# Baseline English confirmed 3/3 before translation. Natural phrasing in each language.

locales:
  en:
    input: "I need to reschedule my Friday appointment to next Monday, something came up."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  fr:
    input: "Je dois reporter mon rendez-vous de vendredi à lundi prochain, un imprévu est survenu."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  ar:
    input: "أحتاج إلى تأجيل موعد الجمعة إلى الاثنين القادم، فقد طرأ أمر طارئ."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  zh:
    input: "我需要把周五的预约改到下周一，临时有事情。"
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  ru:
    input: "Мне нужно перенести запись с пятницы на следующий понедельник, возникли непредвиденные обстоятельства."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  id:
    input: "Saya perlu memindahkan janji temu hari Jumat ke Senin depan, ada sesuatu yang tiba-tiba muncul."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  vi:
    input: "Tôi cần dời lịch hẹn thứ Sáu sang thứ Hai tuần tới vì có việc đột xuất."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  sw:
    input: "Ninahitaji kuhamisha miadi yangu ya Ijumaa hadi Jumatatu ijayo, kuna kitu kilitokea."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  cy:
    input: "Mae angen symud fy apwyntiad dydd Gwener i ddydd Llun nesaf; cododd rhywbeth."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  eu:
    input: "Ostiralarako hitzordua datorren astelehenerako mugitu behar dut, zerbait gertatu baita."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  mn:
    input: "Баасан гарагийн цагийг дараа долоо хоногийн Даваа гараг руу шилжүүлэх хэрэгтэй байна, гэнэтийн зүйл гарлаа."
    expect:
      toolCall:
        name: reschedule_appointment
      noToolCall:
        name: cancel_appointment

  yo:
    input: "Mo nílò láti yí ìpàdé ọjọ́ Jimọ̀ mi padà sí ọjọ́ Àìkú ọ̀sẹ̀ tó ń bọ̀, nǹkan kan ṣẹlẹ̀."
