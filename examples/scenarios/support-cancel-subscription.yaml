      noToolCall:
        name: escalate_to_human

  sw:
    input: "Tafadhali futa usajili wangu. Sistumii tena."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  cy:
    input: "Plîs canslwch fy nhanysgrifiad. Dydw i ddim yn ei ddefnyddio mwyach."
