id: support_cancel_subscription
agent: support

# Domain: support
# Intent: customer explicitly wants to cancel their subscription
# Expected tool: cancel_subscription
# Confusion risk: request_account_review (model hedges, wants to investigate first)
#                 escalate_to_human (model defers instead of acting)
#
# All inputs express the same explicit intent at the same level of directness.
# Natural phrasing in each language — not literal translations.

locales:
  en:
    input: "I've decided I don't need this anymore. Please cancel my subscription."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  fr:
    input: "J'ai décidé que je n'en ai plus besoin. Veuillez annuler mon abonnement."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

