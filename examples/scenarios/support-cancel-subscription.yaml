id: support_cancel_subscription
agent: support

# Domain: support
# Intent: customer explicitly wants to cancel their subscription, with a reason
# Expected tool: cancel_subscription
# Confusion risk: request_account_review (model hedges, wants to investigate first)
#                 escalate_to_human (model defers instead of acting)
#
# cancel_subscription requires a reason; without one the model asks back instead of acting.
# Baseline English confirmed 3/3 before translation. Natural phrasing in each language.

locales:
  en:
    input: "Please cancel my subscription. I'm not using it anymore."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  fr:
    input: "Veuillez annuler mon abonnement. Je ne l'utilise plus."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  ar:
    input: "يرجى إلغاء اشتراكي. لم أعد أستخدمه."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  zh:
    input: "请取消我的订阅，我已经不再使用了。"
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  ru:
    input: "Пожалуйста, отмените мою подписку. Я больше ею не пользуюсь."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  id:
    input: "Tolong batalkan langganan saya. Saya sudah tidak menggunakannya lagi."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  vi:
    input: "Vui lòng hủy gói đăng ký của tôi. Tôi không còn sử dụng nữa."
    expect:
      toolCall:
