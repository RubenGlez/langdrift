    input: "لقد قررت أنني لم أعد بحاجة إلى هذا. يرجى إلغاء اشتراكي."
    expect:
      toolCall:
        name: cancel_subscription
      noToolCall:
        name: escalate_to_human

  zh:
    input: "我决定不再需要这个了。请取消我的订阅。"
    expect:
